name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Capture generated dependency lockfile
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            node --input-type=module -e "import fs from 'node:fs'; const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8')); for(const p of Object.values(lock.packages??{})){if(p.resolved){const u=new URL(p.resolved);if(u.protocol!=='https:'||u.hostname!=='registry.npmjs.org'||u.username||u.password||u.search||u.hash)throw Error('Unexpected registry URL');}} const b=Buffer.from(JSON.stringify(lock,null,2)+'\n').toString('base64'); for(let i=0;i<b.length;i+=2048) console.log('GS_LOCK_CHUNK:'+b.slice(i,i+2048));"
          fi
      - run: npm test
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
